name: Aegis.dmg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Installed:"
          ls /Applications | grep -i xcode || true
          set +e
          PICK=""
          for p in \
            /Applications/Xcode_27.app \
            /Applications/Xcode_27.0.app \
            /Applications/Xcode_27.0.0.app \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode.app
          do
            if [ -d "$p/Contents/Developer" ]; then
              PICK="$p"
              break
            fi
          done
          if [ -n "$PICK" ]; then
            sudo xcode-select -s "$PICK/Contents/Developer"
            echo "Using $PICK"
          fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Read version
        id: ver
        run: |
          MARKETING=$(awk -F' = ' '/MARKETING_VERSION/{gsub(/;/, "", $2); print $2; exit}' macos/AegisScanner.xcodeproj/project.pbxproj)
          CHANNEL=alpha
          TAG="v${MARKETING}-${CHANNEL}"
          TITLE="Aegis ${MARKETING} ${CHANNEL}"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Publishing $TITLE as $TAG"

      - name: Match math tests
        run: |
          swiftc macos/AegisScanner/Models.swift macos/AegisScanner/MatchMath.swift macos/AegisScanner/BenchProtocol.swift macos/AegisScannerTests/MatchMathTests.swift -o /tmp/aegismath
          /tmp/aegismath

      - name: Build Aegis.app
        run: |
          xcodebuild \
            -project macos/AegisScanner.xcodeproj \
            -scheme AegisScanner \
            -configuration Release \
            -derivedDataPath .derived \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=YES \
            build

      - name: Sign and make disk image
        run: |
          set -euo pipefail
          APP=".derived/Build/Products/Release/Aegis.app"
          test -d "$APP"
          rm -rf dmgroot Aegis.dmg
          mkdir dmgroot
          cp -R "$APP" dmgroot/Aegis.app
          codesign --force --sign - \
            --options runtime \
            --timestamp=none \
            --entitlements macos/AegisScanner.entitlements \
            dmgroot/Aegis.app
          ln -s /Applications dmgroot/Applications
          hdiutil create \
            -volname Aegis \
            -srcfolder dmgroot \
            -ov \
            -format UDZO \
            -fs HFS+ \
            Aegis.dmg
          test -f Aegis.dmg
          test ! -d Aegis.dmg
          file Aegis.dmg
          ls -lh Aegis.dmg

      - name: Publish Aegis.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="${{ steps.ver.outputs.title }}"
          NOTES="$(cat <<EOF
          Aegis ${{ steps.ver.outputs.marketing }} ${{ steps.ver.outputs.channel }} — macOS-Image, kein Xcode, kein Python, kein Browser.

          1. Aegis.dmg öffnen
          2. Aegis in den Ordner Programme ziehen
          3. Beim ersten Start: Rechtsklick auf Aegis → Öffnen

          Die Datei ist ad-hoc signiert (kein Apple-Developer-Account).
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Aegis.dmg --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" Aegis.dmg --title "$TITLE" --latest --notes "$NOTES"
          fi
