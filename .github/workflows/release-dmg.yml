name: Aegis.dmg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          MARKETING=$(awk -F' = ' '/MARKETING_VERSION/{gsub(/;/, "", $2); print $2; exit}' macos/AegisScanner.xcodeproj/project.pbxproj)
          CHANNEL=alpha
          TAG="v${MARKETING}-${CHANNEL}"
          TITLE="Aegis ${MARKETING} ${CHANNEL}"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Publishing $TITLE as $TAG"

      - name: Build Aegis.app
        run: |
          xcodebuild \
            -project macos/AegisScanner.xcodeproj \
            -scheme AegisScanner \
            -configuration Release \
            -derivedDataPath .derived \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Make disk image
        run: |
          APP=".derived/Build/Products/Release/Aegis.app"
          test -d "$APP"
          rm -rf dmgroot
          mkdir dmgroot
          cp -R "$APP" dmgroot/Aegis.app
          codesign --force --deep --sign - dmgroot/Aegis.app || true
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname Aegis -srcfolder dmgroot -ov -format UDZO Aegis.dmg
          ls -lh Aegis.dmg

      - name: Publish Aegis.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="${{ steps.ver.outputs.title }}"
          NOTES="$(cat <<EOF
          Aegis ${{ steps.ver.outputs.marketing }} ${{ steps.ver.outputs.channel }} — macOS-Image, kein Xcode, kein Python, kein Browser.

          1. Aegis.dmg öffnen
          2. Aegis in den Ordner Programme ziehen
          3. Beim ersten Start: Rechtsklick auf Aegis → Öffnen

          Die Datei ist ad-hoc signiert (kein Apple-Developer-Account).
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Aegis.dmg --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" Aegis.dmg --title "$TITLE" --prerelease --notes "$NOTES"
          fi

      - name: Put Aegis.dmg in Code tab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Aegis.dmg
          if git diff --cached --quiet; then
            echo "dmg unchanged"
            exit 0
          fi
          git commit -m "Aegis.dmg ${{ steps.ver.outputs.title }} [skip ci]"
          git push
