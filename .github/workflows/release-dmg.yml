name: Aegis.dmg

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'AGENT.md'
      - 'CLAUDE.md'
      - 'agent.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aegis-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      BUILD_CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE }}
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
      APPLEID: ${{ secrets.APPLEID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      API_KEY_P8: ${{ secrets.API_KEY_P8 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      API_KEY_ID: ${{ secrets.API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      ISSUER_ID: ${{ secrets.ISSUER_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Installed:"
          ls /Applications | grep -i xcode || true
          set +e
          PICK=""
          BEST=""
          for p in /Applications/Xcode*.app; do
            if [ ! -d "$p/Contents/Developer" ]; then
              continue
            fi
            ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$p/Contents/Info.plist" 2>/dev/null || echo 0)
            if [ -z "$BEST" ]; then
              BEST="$ver"
              PICK="$p"
              continue
            fi
            top=$(printf '%s\n%s\n' "$BEST" "$ver" | sort -V | tail -n 1)
            if [ "$top" = "$ver" ] && [ "$ver" != "$BEST" ]; then
              BEST="$ver"
              PICK="$p"
            fi
          done
          if [ -n "$PICK" ]; then
            sudo xcode-select -s "$PICK/Contents/Developer"
            echo "Using $PICK ($BEST)"
          fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Read version
        run: |
          MARKETING=$(awk -F' = ' '/MARKETING_VERSION/{gsub(/;/, "", $2); print $2; exit}' macos/AegisScanner.xcodeproj/project.pbxproj)
          echo "$MARKETING" > marketing.txt
          echo "Aegis ${MARKETING} alpha"

      - name: Match math tests
        run: |
          swiftc macos/AegisScanner/Models.swift macos/AegisScanner/MatchMath.swift macos/AegisScanner/BenchProtocol.swift macos/AegisScannerTests/MatchMathTests.swift -o /tmp/aegismath
          /tmp/aegismath

      - name: Build Aegis.app
        run: |
          xcodebuild \
            -project macos/AegisScanner.xcodeproj \
            -scheme AegisScanner \
            -configuration Release \
            -derivedDataPath .derived \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=YES \
            build

      - name: Sign app, make disk image, notarize
        run: |
          set -euo pipefail
          chmod +x macos/ci-sign.sh
          APP=".derived/Build/Products/Release/Aegis.app"
          test -d "$APP"
          rm -rf dmgroot Aegis.dmg
          mkdir dmgroot
          cp -R "$APP" dmgroot/Aegis.app
          macos/ci-sign.sh app dmgroot/Aegis.app
          ln -s /Applications dmgroot/Applications
          hdiutil create \
            -volname Aegis \
            -srcfolder dmgroot \
            -ov \
            -format UDZO \
            -fs HFS+ \
            Aegis.dmg
          test -f Aegis.dmg
          test ! -d Aegis.dmg
          macos/ci-sign.sh dmg Aegis.dmg
          file Aegis.dmg
          ls -lh Aegis.dmg
          cat signing.txt 2>/dev/null || cat dmgroot/signing.txt 2>/dev/null || true
          if [ -f dmgroot/signing.txt ] && [ ! -f signing.txt ]; then
            cp dmgroot/signing.txt signing.txt
          fi

      - name: Upload Aegis.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-macos-15
          path: |
            Aegis.dmg
            marketing.txt
            signing.txt
          if-no-files-found: error

  publish:
    needs: package
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: false
          path: dist

      - name: Publish Aegis.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          find dist -type f -print
          DMG=$(find dist -path '*macos-15*' -name 'Aegis.dmg' | head -n 1)
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            DMG=$(find dist -name 'Aegis.dmg' | head -n 1)
          fi
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "Kein Aegis.dmg" >&2
            exit 1
          fi
          MARKETING=$(cat "$(dirname "$DMG")/marketing.txt" 2>/dev/null || echo "2.1.154")
          SIGN_MODE=$(awk -F= '/^mode=/{print $2; exit}' "$(dirname "$DMG")/signing.txt" 2>/dev/null || echo adhoc)
          TAG="v${MARKETING}-alpha"
          TITLE="Aegis ${MARKETING} alpha"
          cp "$DMG" Aegis.dmg
          file Aegis.dmg
          case "$SIGN_MODE" in
            notarized)
              SIGN_NOTE="Die Datei ist mit Developer ID signiert und notarisiert. Gatekeeper lässt den Start zu."
              ;;
            developer-id|developer-id-unnotarized)
              SIGN_NOTE="Die Datei ist mit Developer ID signiert. Notarisierung steht noch aus — beim ersten Start ggf. Rechtsklick → Öffnen."
              ;;
            *)
              SIGN_NOTE="Die Datei ist ad-hoc signiert (kein Zertifikat im Runner). Beim ersten Start: Rechtsklick auf Aegis → Öffnen."
              ;;
          esac
          NOTES="$(cat <<EOF
          Aegis ${MARKETING} alpha — macOS-Image, kein Xcode, kein Python, kein Browser.

          1. Aegis.dmg öffnen
          2. Aegis in den Ordner Programme ziehen
          3. ${SIGN_NOTE}

          Signatur: ${SIGN_MODE}.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Aegis.dmg --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" Aegis.dmg --title "$TITLE" --latest --notes "$NOTES"
          fi
