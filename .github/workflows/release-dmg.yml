name: Aegis.dmg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Installed:"
          ls /Applications | grep -i xcode || true
          set +e
          PICK=""
          for p in \
            /Applications/Xcode_27.app \
            /Applications/Xcode_27.0.app \
            /Applications/Xcode_27.0.0.app \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode.app
          do
            if [ -d "$p/Contents/Developer" ]; then
              PICK="$p"
              break
            fi
          done
          if [ -n "$PICK" ]; then
            sudo xcode-select -s "$PICK/Contents/Developer"
            echo "Using $PICK"
          fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Read version
        run: |
          MARKETING=$(awk -F' = ' '/MARKETING_VERSION/{gsub(/;/, "", $2); print $2; exit}' macos/AegisScanner.xcodeproj/project.pbxproj)
          echo "$MARKETING" > marketing.txt
          echo "Aegis ${MARKETING} alpha"

      - name: Match math tests
        run: |
          swiftc macos/AegisScanner/Models.swift macos/AegisScanner/MatchMath.swift macos/AegisScanner/BenchProtocol.swift macos/AegisScannerTests/MatchMathTests.swift -o /tmp/aegismath
          /tmp/aegismath

      - name: Build Aegis.app
        run: |
          xcodebuild \
            -project macos/AegisScanner.xcodeproj \
            -scheme AegisScanner \
            -configuration Release \
            -derivedDataPath .derived \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=YES \
            build

      - name: Sign and make disk image
        run: |
          set -euo pipefail
          APP=".derived/Build/Products/Release/Aegis.app"
          test -d "$APP"
          rm -rf dmgroot Aegis.dmg
          mkdir dmgroot
          cp -R "$APP" dmgroot/Aegis.app
          codesign --force --sign - \
            --options runtime \
            --timestamp=none \
            --entitlements macos/AegisScanner.entitlements \
            dmgroot/Aegis.app
          ln -s /Applications dmgroot/Applications
          hdiutil create \
            -volname Aegis \
            -srcfolder dmgroot \
            -ov \
            -format UDZO \
            -fs HFS+ \
            Aegis.dmg
          test -f Aegis.dmg
          test ! -d Aegis.dmg
          file Aegis.dmg
          ls -lh Aegis.dmg

      - name: Upload Aegis.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.os }}
          path: |
            Aegis.dmg
            marketing.txt
          if-no-files-found: error

  publish:
    needs: package
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: false
          path: dist

      - name: Publish Aegis.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          find dist -type f -print
          DMG=$(find dist -path '*macos-15*' -name 'Aegis.dmg' | head -n 1)
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            DMG=$(find dist -name 'Aegis.dmg' | head -n 1)
          fi
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "Kein Aegis.dmg" >&2
            exit 1
          fi
          MARKETING=$(cat "$(dirname "$DMG")/marketing.txt" 2>/dev/null || echo "2.1.154")
          TAG="v${MARKETING}-alpha"
          TITLE="Aegis ${MARKETING} alpha"
          cp "$DMG" Aegis.dmg
          file Aegis.dmg
          NOTES="$(cat <<EOF
          Aegis ${MARKETING} alpha — macOS-Image, kein Xcode, kein Python, kein Browser.

          1. Aegis.dmg öffnen
          2. Aegis in den Ordner Programme ziehen
          3. Beim ersten Start: Rechtsklick auf Aegis → Öffnen

          Die Datei ist ad-hoc signiert (kein Apple-Developer-Account).
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Aegis.dmg --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" Aegis.dmg --title "$TITLE" --latest --notes "$NOTES"
          fi
